        margin: 0;
        line-height: 1.6;

      .container {
        max-width: 100%;
        margin: 0;
        padding: 0;
      }

      .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 100%;
        margin: 0;
        padding: 0;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      img[src$=".svg"] {
        width: 100%;
        height: auto;
        max-width: 100%;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      a {
        color: #58a6ff;
        text-decoration: none;
      }

      a:hover {
