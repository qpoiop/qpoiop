<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- 양각 효과 필터 (Raised) -->
    <filter id="neumorphism-text-raised" x="-50%" y="-50%" width="200%" height="200%">
      <!-- 어두운 그림자 (오른쪽 하단) -->
      <feDropShadow dx="4" dy="4" stdDeviation="5" flood-color="#bebebe" flood-opacity="1"/>
      <!-- 밝은 그림자 (왼쪽 상단) -->
      <feDropShadow dx="-4" dy="-4" stdDeviation="5" flood-color="#ffffff" flood-opacity="1"/>
    </filter>
    
    <!-- 음각 효과 필터 (Inset/Engraved) -->
    <filter id="neumorphism-text-inset" x="-50%" y="-50%" width="200%" height="200%">
      <!-- 어두운 그림자 (왼쪽 상단) - 음각 -->
      <feDropShadow dx="-4" dy="-4" stdDeviation="5" flood-color="#bebebe" flood-opacity="1"/>
      <!-- 밝은 그림자 (오른쪽 하단) - 음각 -->
      <feDropShadow dx="4" dy="4" stdDeviation="5" flood-color="#ffffff" flood-opacity="1"/>
    </filter>
    
    <!-- Neumorphism Filter for Background Container -->
    <filter id="neomorph-bg" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Dark shadow (bottom-right) -->
      <feDropShadow dx="10" dy="10" stdDeviation="15" flood-color="#bebebe" flood-opacity="1"/>
      <!-- Light shadow (top-left) -->
      <feDropShadow dx="-10" dy="-10" stdDeviation="15" flood-color="#ffffff" flood-opacity="1"/>
    </filter>
  </defs>

  <style>
    .container {
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 60px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    
    /* Transform Animation */
    @keyframes riseTransform {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }
    
    /* Raised Filter Opacity Animation */
    @keyframes raisedOpacity {
      0%, 100% {
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
    }

    .word-base {
      animation: riseTransform 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      fill: #e0e0e0;  /* Same as background */
      cursor: default;
    }
    
    .word-raised {
      animation: riseTransform 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite,
                 raisedOpacity 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      fill: #e0e0e0;  /* Same as background */
      filter: url(#neumorphism-text-raised);
      cursor: default;
    }
    
    .word-static {
      fill: #e0e0e0;  /* Same as background */
      filter: url(#neumorphism-text-inset);
      cursor: default;
    }
    
    .w-1 { animation-delay: 0s; }
    .w-2 { animation-delay: 0.5s; }
    .w-3 { animation-delay: 0.7s; }
    .w-4 { animation-delay: 1s; }
    .w-5 { animation-delay: 1.5s; }
    .w-6 { animation-delay: 1.7s; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#e0e0e0" />
  
  <!-- Neumorphism Container Background -->
  <rect x="50" y="25" width="1100" height="250" rx="20" ry="20" fill="#e0e0e0" filter="url(#neomorph-bg)" />
  
  <g class="container" transform="translate(600, 150)">
    <!-- 위쪽 줄 - 평지 레이어 (기본) -->
    <text class="word-base w-1" x="-250" y="-30">Undefined</text>
    <text class="word-base w-2" x="-70" y="-30">Is</text>
    <text class="word-base w-3" x="10" y="-30">Not</text>
    <text class="word-base w-4" x="90" y="-30">A</text>
    <text class="word-base w-5" x="250" y="-30">Function</text>
    <text class="word-base w-6" x="390" y="-30">.</text>
    
    <!-- 위쪽 줄 - 양각 레이어 (opacity로 전환) -->
    <text class="word-raised w-1" x="-250" y="-30">Undefined</text>
    <text class="word-raised w-2" x="-70" y="-30">Is</text>
    <text class="word-raised w-3" x="10" y="-30">Not</text>
    <text class="word-raised w-4" x="90" y="-30">A</text>
    <text class="word-raised w-5" x="250" y="-30">Function</text>
    <text class="word-raised w-6" x="390" y="-30">.</text>
    
    <!-- 아래쪽 줄 - QPOIOP 음각 (애니메이션 없음) -->
    <text class="word-static" x="0" y="70" font-size="40px">QPOIOP</text>
  </g>

</svg>
